name: k3s

services:

  server:
    image: "rancher/k3s:v1.32.3-k3s1"
    hostname: server
    command: |
      server --disable=traefik --tls-san=microuser-DARK5 --tls-san=microuser-DARK5.local
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    privileged: true
    restart: on-failure
    environment:
      - K3S_TOKEN=token
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - k3s-server:/var/lib/rancher/k3s
      # This is just so that we get the kubeconfig file out
      - .:/output
    ports:
      - "6443:6443"  # Kubernetes API Server
      - "80:80"      # Ingress controller port 80
      - "443:443"    # Ingress controller port 443

  agent-1:
    image: "rancher/k3s:v1.32.3-k3s1"
    hostname: agent-1
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    privileged: true
    restart: on-failure
    environment:
      - K3S_URL=https://server:6443
      - K3S_TOKEN=token
    volumes:
      - k3s-agent:/var/lib/rancher/k3s
      # Mount application data folder
      - /k3s-appdata:/mnt/data
      # mount BAG volume
      - /media/microuser/BAG:/mnt/bag

volumes:
  k3s-server: {}
  k3s-agent: {}
