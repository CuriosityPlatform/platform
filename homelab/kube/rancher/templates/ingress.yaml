apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rancher
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30s"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "20s"
    nginx.ingress.kubernetes.io/listen-ports: "80"
spec:
  ingressClassName: nginx
  rules:
    - host: rancher.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ template "rancher.fullname" .}}
                port:
                  number: {{ .Values.rancher.ingress.servicePort }}
