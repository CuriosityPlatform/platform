apiVersion: v1
kind: PersistentVolume
metadata:
  name: autorestic-pv
  labels:
    directory: autorestic
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow
  hostPath:
    path: /mnt/bag
  # Place pv at agent-1 node
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "agent-1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autorestic-pvc
spec:
  storageClassName: slow
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      directory: autorestic
