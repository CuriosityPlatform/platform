apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../components/ingress-nginx
  - definition

replacements:
  # ingress hosts replacements
  - source:
      kind: ConfigMap
      name: ingress-hosts
      fieldPath: data.app-host
    targets:
      - select:
          kind: Ingress
          name: homelab
        fieldPaths:
          - spec.rules.[host=APP_HOST].host
  - source:
      kind: ConfigMap
      name: ingress-hosts
      fieldPath: data.transmission-host
    targets:
      - select:
          kind: Ingress
          name: homelab-transmission
        fieldPaths:
          - spec.rules.[host=TRANSIMISSION_HOST].host
  - source:
      kind: ConfigMap
      name: ingress-hosts
      fieldPath: data.restic-host
    targets:
      - select:
          kind: Ingress
          name: homelab-restic
        fieldPaths:
          - spec.rules.[host=RESTIC_HOST].host
