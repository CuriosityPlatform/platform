apiVersion: v1
kind: PersistentVolume
metadata:
  name: restic-data-volume
  labels:
    directory: restic-data
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: slow
  hostPath:
    path: /mnt/bag/restic
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-data-claim
spec:
  storageClassName: slow
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  selector:
    matchLabels:
      directory: restic-data