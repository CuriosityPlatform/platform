services:
  amnezia-wg-easy:
    image: ghcr.io/w0rng/amnezia-wg-easy:14
    container_name: amnezia-wg-easy
    environment:
      - WG_HOST=address
      - PASSWORD_HASH=hash
      - UI_CHART_TYPE=2
      - WG_ENABLE_ONE_TIME_LINKS=true
    volumes:
      - "~/.amnezia-wg-easy:/etc/wireguard"
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun